<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maaber - دروب آمنة</title>
    <!-- استدعاء مكتبة الخرائط Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #030305;
            color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .phone-container {
            width: 100%;
            max-width: 410px;
            height: 100%;
            max-height: 850px;
            background: linear-gradient(180deg, #09090e 0%, #030305 100%);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.15);
            border: 1px solid rgba(0, 243, 255, 0.2);
        }
        @media (min-width: 411px) {
            .phone-container {
                border-radius: 36px;
                height: 94vh;
            }
        }
        /* محتوى الشاشات */
        .screen {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: none;
            flex-direction: column;
            gap: 14px;
        }
        .screen.active {
            display: flex;
        }
        /* عرض الصور المصممة كواجهات متكاملة */
        .design-preview {
            width: 100%;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(0, 242, 254, 0.3);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.15);
            cursor: pointer;
            margin-bottom: 10px;
        }
        .design-preview img {
            width: 100%;
            height: auto;
            display: block;
        }
        /* شاشة الخريطة */
        .map-layout {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 0;
        }
        .map-container {
            flex: 1;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(0, 242, 254, 0.3);
            min-height: 240px;
            position: relative;
        }
        #real-map {
            width: 100%;
            height: 100%;
            background: #09090e;
        }
        /* زر رئيسي متوهج */
        .btn-primary {
            background: linear-gradient(135deg, #00f2fe 0%, #047857 100%);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 700;
            width: 100%;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 242, 254, 0.3);
        }
        /* الفوتر السفلي السحابي الفخم */
        footer {
            background: rgba(5, 5, 8, 0.95);
            backdrop-filter: blur(16px);
            border-top: 1px solid rgba(255,255,255,0.08);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }
        .nav-item {
            background: none;
            border: none;
            color: #64748b;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .nav-item.active {
            color: #00f2fe;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
        }
        .nav-item span {
            font-size: 20px;
        }
    </style>
</head>
<body>

<div class="phone-container">
    <!-- 1. الشاشة الرئيسية (تستدعي صورتك الأولى المصممة) -->
    <div id="screen-home" class="screen active">
        <div class="design-preview" onclick="switchScreen('map')">
            <img src="file_000000003c388210915c5ba365459a8a.png" alt="واجهة الرئيسية معابر">
        </div>
        <div style="text-align: center; color: #94a3b8; font-size: 12px;">انقر على التصميم للانتقال المباشر للمسار الآمن 🗺️</div>
    </div>

    <!-- 2. شاشة الخريطة التفاعلية -->
    <div id="screen-map" class="screen">
        <div class="map-layout">
            <div style="font-size: 15px; font-weight: 700; color: #00f2fe;">🧭 خريطة الدروب الآمنة</div>
            <div class="map-container">
                <div id="real-map"></div>
            </div>
            <div class="design-preview" style="margin: 0;" onclick="switchScreen('report')">
                <img src="file_0000000094088210accacb42012609b7.png" alt="خريطة معابر">
            </div>
            <button class="btn-primary" onclick="alert('تم تفعيل التوجيه الصوتي للمسار الآمن بنجاح.')">بدء التوجيه الصوتي 🔊</button>
        </div>
    </div>

    <!-- 3. شاشة الإبلاغ عن العوائق (تستدعي صورتك الثانية المصممة) -->
    <div id="screen-report" class="screen">
        <div class="design-preview" onclick="sendReportToFirebase()">
            <img src="file_0000000048c824696dda2f0e3716f59.png" alt="شاشة الإبلاغ">
        </div>
        <button class="btn-primary" onclick="sendReportToFirebase()">إرسال التنبيه للسحابة 🚀</button>
    </div>

    <!-- الفوتر السفلي المضيء -->
    <footer>
        <button class="nav-item" id="nav-report" onclick="switchScreen('report')">
            <span>⚠️</span>الإبلاغ
        </button>
        <button class="nav-item" id="nav-map" onclick="switchScreen('map')">
            <span>🗺️</span>الخريطة
        </button>
        <button class="nav-item active" id="nav-home" onclick="switchScreen('home')">
            <span>🏠</span>الرئيسية
        </button>
    </footer>
</div>

<!-- مكتبة Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Firebase SDKs -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyApq09S2WZ2xz258rfCzwIYJJcKADKr-0c",
      authDomain: "maaber-32d38.firebaseapp.com",
      projectId: "Maaber-32d38",
      storageBucket: "maaber-32d38.firebasestorage.app",
      messagingSenderId: "468110333900",
      appId: "1:468110333900:web:d8d6b8e2fda75d45142f69"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let map = null;

    window.switchScreen = function(screenName) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

        document.getElementById('screen-' + screenName).classList.add('active');
        
        if(document.getElementById('nav-' + screenName)) {
            document.getElementById('nav-' + screenName).classList.add('active');
        }

        if (screenName === 'map') {
            setTimeout(() => {
                if (!map) {
                    map = L.map('real-map').setView([35.2136, 4.7558], 16);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        maxZoom: 19,
                        attribution: 'Maaber Safe Routes'
                    }).addTo(map);

                    L.marker([35.2136, 4.7558]).addTo(map)
                        .bindPopup('<b>🟢 مسار آمن ممهد للكرسي المتحرك</b>')
                        .openPopup();
                }
                loadReportsFromFirebase(map);
                map.invalidateSize();
            }, 250);
        }
    }

    window.sendReportToFirebase = async function() {
        try {
            await addDoc(collection(db, "reports"), {
                type: "عائق مرصود من الواجهة",
                lat: 35.2136 + (Math.random() - 0.5) * 0.01,
                lng: 4.7558 + (Math.random() - 0.5) * 0.01,
                createdAt: new Date().toISOString()
            });
            alert('تم إرسال التنبيه وحفظه في سحابة Firebase بنجاح! 🚀');
            window.switchScreen('home');
        } catch (e) {
            console.error("Error adding document: ", e);
            alert('حدث خطأ أثناء الإرسال، تأكد من الاتصال.');
        }
    }

    async function loadReportsFromFirebase(currentMap) {
        try {
            const querySnapshot = await getDocs(collection(db, "reports"));
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                L.marker([data.lat, data.lng]).addTo(currentMap)
                    .bindPopup(`<b>⚠️ تنبيه عائق:</b><br>${data.type}`);
            });
        } catch (e) {
            console.error("Error loading reports: ", e);
        }
    }
</script>

</body>
</html>
